version: 2
models:
  - name: raw_customers
    columns:
      - name: customer_id
    tests:
      - not_null
      - unique
  - name: raw_orders
    columns:
      - name: order_id
    tests:
      - not_null
      - unique
      - accepted_values:
          values:
            - "same day"
            - "standard class"
            - "first class"
            - "second class"
